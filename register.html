<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آرورا - ثبت نام</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="//esm.sh/gh/rahatool/persian-fonts/main.css" />
</head>
<body>
<header class="site-header">
    <div class="container">
        <nav class="main-nav">
            <a href="index.html" class="logo">آرورا</a>
            <ul>
                <li><a href="index.html">خانه</a></li>
                <li><a href="about.html">درباره ما</a></li>
                <li><a href="login.html" class="nav-button">ورود</a></li>
                <li><a href="register.html" class="nav-button-primary">ثبت نام</a></li>
            </ul>
        </nav>
    </div>
</header>
<main>
    <section class="form-section section-padding">
        <div class="container">
            <div class="form-grid">
                <div class="form-decoration" data-aos="fade-left">
                    <div class="decoration-shape shape-1"></div>
                    <div class="decoration-shape shape-2"></div>
                    <div class="decoration-shape shape-3"></div>
                </div>
                <div class="form-wrapper" data-aos="fade-right">
                    <form id="register-form" class="form-card">
                        <h2 class="form-title">حساب کاربری خود را بسازید</h2>
                        <p class="form-subtitle">به ما بپیوندید و سفر خلاقانه خود را آغاز کنید.</p>
                        <div class="form-group">
                            <label for="name" class="form-label">نام</label>
                            <input type="text" id="name" name="name" class="form-input" placeholder="نام خود را وارد کنید" required>
                        </div>
                        <div class="form-group">
                            <label for="email" class="form-label">ایمیل</label>
                            <input type="email" id="email" name="email" class="form-input" placeholder="ایمیل خود را وارد کنید" required>
                        </div>
                        <div class="form-group">
                            <label for="password" class="form-label">رمز عبور</label>
                            <input type="password" id="password" name="password" class="form-input" placeholder="رمز عبور خود را وارد کنید" required>
                        </div>
                        <div class="form-group">
                            <label for="confirm-password" class="form-label">تکرار رمز عبور</label>
                            <input type="password" id="confirm-password" name="confirm-password" class="form-input" placeholder="رمز عبور خود را تکرار کنید" required>
                        </div>
                        <button type="submit" class="cta-button-primary form-button">ثبت نام</button>
                        <p class="form-message"></p>
                        <p class="form-switch">قبلا حساب کاربری ساخته‌اید؟ <a href="login.html">ورود</a></p>
                    </form>
                </div>
            </div>
        </div>
    </section>
</main>
<footer class="site-footer">
    <div class="container">
        <p>&copy; 2025 آرورا. تمام حقوق محفوظ است. | یک آژانس خلاق مدرن.</p>
    </div>
</footer>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
