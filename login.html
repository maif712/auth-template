<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora - Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>
<body>
<header class="site-header">
    <div class="container">
        <nav class="main-nav">
            <a href="index.html" class="logo">Aurora</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="login.html" class="nav-button">Login</a></li>
                <li><a href="register.html" class="nav-button-primary">Register</a></li>
            </ul>
        </nav>
    </div>
</header>
<main>
    <section class="form-section section-padding">
        <div class="container">
            <div class="form-container" data-aos="fade-up">
                <form id="login-form" class="form-card">
                    <h2 class="form-title">Login</h2>
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="cta-button-primary form-button">Login</button>
                    <p class="form-message"></p>
                </form>
            </div>
        </div>
    </section>
</main>
<footer class="site-footer">
    <div class="container">
        <p>&copy; 2025 Aurora. All rights reserved. | A modern creative agency.</p>
    </div>
</footer>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
